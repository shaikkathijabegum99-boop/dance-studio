
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | City Beats Dance Studio</title>

    <link rel="icon" type="image/png" href="../images/logo2.jpg.png">

    <link rel="stylesheet" href="../global/global.css">
    <link rel="stylesheet" href="../css/com.css">
    <link rel="stylesheet" href="auth.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-page">

    <!-- Theme & RTL Controls -->
    <div class="top-actions">

        <button id="rtlToggle" class="icon-btn" type="button">
            <i class="fas fa-right-left"></i>
        </button>

        <button id="themeToggle" class="icon-btn" type="button">
            <i class="fa-solid fa-moon"></i>
        </button>

    </div>

    <div class="auth-wrapper">

        <div class="auth-card">

            <!-- Logo -->
            <a href="../index.html" class="logo-box">

                <img
                    src="../images/logo2.jpg.png"
                    alt="City Beats Dance Studio"
                    class="nav-logo-img">

                <div class="logo-text">

                    <span class="brand-name">
                        CITY BEATS
                    </span>

                    <span class="brand-subtext">
                        DANCE STUDIO
                    </span>

                </div>

            </a>

            <!-- Heading -->
            <h1>Create Account</h1>

            <p class="auth-desc">
                Join City Beats and start your dance journey today.
            </p>

            <!-- Signup Form -->
            <form class="auth-form">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        placeholder="Enter your full name"
                        required>

                </div>

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        placeholder="Enter your phone number"
                        required>

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create password"
                            required>

                        <i class="fa-solid fa-eye toggle-password"></i>

                    </div>

                </div>

                <div class="form-group">

                    <label>Confirm Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required>

                        <i class="fa-solid fa-eye toggle-password"></i>

                    </div>

                </div>

                <div class="form-options">

                    <label class="remember">

                        <input type="checkbox" required>

                        I agree to the Terms & Conditions

                    </label>

                </div>

                <button
                    type="submit"
                    class="auth-btn">

                    Create Account

                </button>

            </form>

            <!-- Divider -->
            <div class="divider">

                <span>OR CONTINUE WITH</span>

            </div>

            <!-- Social Login -->
            <div class="social-login">

                <button type="button" class="social-btn google">

                    <i class="fa-brands fa-google"></i>

                    <span>Google</span>

                </button>

                <button type="button" class="social-btn apple">

                    <i class="fa-brands fa-apple"></i>

                    <span>Apple</span>

                </button>

                <button type="button" class="social-btn facebook">

                    <i class="fa-brands fa-facebook-f"></i>

                    <span>Facebook</span>

                </button>

            </div>

            <!-- Footer -->
            <div class="auth-footer">

                Already have an account?

                <a href="signin.html">
                    Sign In
                </a>

            </div>

        </div>

    </div>

    <script src="auth.js"></script>
    <script src="../global/global.js"></script>
    <script src="../js/component.js"></script>

</body>

</html>
