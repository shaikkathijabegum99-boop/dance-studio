<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sign In | City Beats Dance Studio</title>

  <link rel="icon" type="image/png" href="../images/logo2.jpg.png" />

  <link rel="stylesheet" href="../global/global.css" />
  <link rel="stylesheet" href="auth.css" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
</head>

<body>

  <div class="auth-container">

    <div class="auth-card">

      <!-- ACTION BUTTONS -->
      <div class="page-actions">

        <button id="themeToggle" class="action-btn" type="button">
          <i class="fas fa-moon"></i>
        </button>

        <button id="rtlToggle" class="action-btn" type="button">
          <i class="fas fa-right-left"></i>
        </button>

      </div>

      <!-- LOGO -->
      <a href="../index.html" class="logo-box">

        <img
          src="../images/logo2.jpg.png"
          alt="City Beats Dance Studio Logo"
          class="nav-logo-img"
        />

        <div class="logo-text">
          <span class="brand-name">CITY BEATS</span>
          <span class="brand-subtext">DANCE STUDIO</span>
        </div>

      </a>

      <!-- HEADING -->
      <h1>Welcome Back</h1>
      <p>Sign in to continue your dance journey.</p>

      <!-- FORM -->
      <form>

        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input
            type="email"
            placeholder="Email Address"
            required
          />
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input
            type="password"
            placeholder="Password"
            required
          />
        </div>

        <div class="options">

  <label for="rememberMe">
    <input type="checkbox" id="rememberMe">
    <span>Remember Me</span>
  </label>

  <a href="forgot-password.html">Forgot Password?</a>

</div>
      </form>

      <!-- DIVIDER -->
      <div class="divider">
        <span>OR CONTINUE WITH</span>
      </div>

      <!-- SOCIAL LOGIN -->
      <div class="social-login">

        <a href="#" class="social-btn">
          <i class="fab fa-google"></i>
          <span>Google</span>
        </a>

        <a href="#" class="social-btn">
          <i class="fab fa-apple"></i>
          <span>Apple</span>
        </a>

      </div>

      <!-- SIGN UP -->
      <p class="switch-text">
        Don't have an account?
        <a href="signup.html">Create Account</a>
      </p>

    </div>

  </div>

  <script src="auth.js"></script>
  <script src="../global/global.js"></script>
  <script src="../js/component.js"></script>

</body>
</html>
