<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Services | City Beats Dance Studio</title>

  <link rel="icon" type="image/png" href="../images/logo2.jpg.png" />

  
  <link rel="stylesheet" href="../global/global.css" />
  <link rel="stylesheet" href="../css/com.css" />
  <link rel="stylesheet" href="auth.css" />

  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
<body class="auth-page">


<div class="top-actions">

    <button id="rtlToggle" class="icon-btn">
        <i class="fas fa-right-left"></i>
    </button>

    <button id="themeToggle" class="icon-btn">
        <i class="fa-solid fa-moon"></i>
    </button>

</div>

<div class="auth-wrapper">

    <div class="auth-card">

        <a href="../index.html" class="logo-box">

            <img
                src="../images/logo2.jpg.png"
                alt="City Beats Dance Studio"
                class="nav-logo-img">

            <div class="logo-text">

                <span class="brand-name">
                    CITY BEATS
                </span>

                <span class="brand-subtext">
                    DANCE STUDIO
                </span>

            </div>

        </a>

        <h1>Welcome Back</h1>

        <p class="auth-desc">
            Sign in to continue your dance journey.
        </p>

        <form class="auth-form">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required>

                    <i class="fa-solid fa-eye toggle-password"></i>

                </div>

            </div>

            <div class="form-options">

                <label class="remember">

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="forgot-password.html" class="forgot-link">
                    Forgot Password?
                </a>

            </div>

            <button
                type="submit"
                class="auth-btn">

                Sign In

            </button>

        </form>

        <div class="divider">

            <span>OR CONTINUE WITH</span>

        </div>

        <div class="social-login">

            <button class="social-btn google">

                <i class="fa-brands fa-google"></i>

                <span>Google</span>

            </button>

            <button class="social-btn apple">

                <i class="fa-brands fa-apple"></i>

                <span>Apple</span>

            </button>

            <button class="social-btn facebook">

                <i class="fa-brands fa-facebook-f"></i>

                <span>Facebook</span>

            </button>

        </div>

        <div class="auth-footer">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </div>

    </div>

</div>

<script src="auth.js"></script>
```

</body>
