<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Trial Class | City Beats Dance Studio</title>

<link rel="icon" type="image/png" href="../images/logo2.jpg.png">

<link rel="stylesheet" href="book.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<div class="booking-container">

  
  <div class="page-actions">

    <button id="themeToggle" class="action-btn">
      <i class="fas fa-moon"></i>
    </button>

    <button id="rtlToggle" class="action-btn">
      <i class="fas fa-right-left"></i>
    </button>

  </div>

 

  <div class="booking-card">
 
  <a href="../index.html" class="logo-box">

    <img
      src="../images/logo2.jpg.png"
      alt="City Beats Logo"
      class="nav-logo-img"
    >

    <div class="logo-text">
      <span class="brand-name">CITY BEATS</span>
      <span class="brand-subtext">DANCE STUDIO</span>
    </div>

  </a>
    <h1>Book Trial Class</h1>

    <p>
      Start your dance journey with a free trial session.
    </p>

    <form>

      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" placeholder="Full Name" required>
      </div>

      <div class="input-group">
        <i class="fas fa-phone"></i>
        <input type="tel" placeholder="Phone Number" required>
      </div>

      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" placeholder="Email Address" required>
      </div>

      <div class="input-group">
        <i class="fas fa-music"></i>

        <select required>
          <option value="">Select Dance Style</option>
          <option>Hip Hop</option>
          <option>Bollywood</option>
          <option>Contemporary</option>
          <option>Jazz</option>
          <option>Salsa</option>
        </select>
      </div>

      <div class="input-group">
        <i class="fas fa-calendar"></i>
        <input type="date" required>
      </div>

      <button class="btn" type="submit">
        Book Now
      </button>

    </form>

  </div>

</div>

<script>

const themeBtn = document.getElementById("themeToggle");
const rtlBtn = document.getElementById("rtlToggle");

themeBtn.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");
});

rtlBtn.addEventListener("click", () => {

  document.documentElement.dir =
    document.documentElement.dir === "rtl"
      ? "ltr"
      : "rtl";

});

</script>

</body>
</html>
